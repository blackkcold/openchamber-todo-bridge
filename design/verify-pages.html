<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>渲染验证 — 面板与看板</title>
    <style>
      body { font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 16px; background: #f7f6f0; color: #100f0f; }
      h1 { font-size: 16px; }
      h2 { font-size: 13px; margin: 20px 0 8px; }
      .tip { color: #6f6e69; max-width: 820px; }
      .pane { border: 1px solid #dad8ce; border-radius: 8px; overflow: hidden; background: #fffcf0; }
      #panelPane { width: 320px; height: 200px; }
      #boardPane { width: 100%; height: 620px; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      #log { color: #6f6e69; white-space: pre-wrap; font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>面板与看板 — 协议桩</h1>
    <p class="tip">
      真实 <code>panel/index.html</code>（窄栏）与 <code>board/index.html</code>（全屏看板），
      接同一套协议桩。桩回答 ready / file-read / file-list / storage，并吞掉 compose / clipboard / toast。
    </p>

    <h2>rail 面板（当前会话 = ses_tree）</h2>
    <div class="pane" id="panelPane"><iframe id="panel"></iframe></div>

    <h2>全屏看板（全部会话）</h2>
    <div class="pane" id="boardPane"><iframe id="board"></iframe></div>

    <pre id="log">— 等待 —</pre>

    <script>
      const CHANNEL = "openchamber.sdk"
      const V = 1
      const log = document.getElementById("log")
      const say = (line) => { log.textContent = log.textContent === "— 等待 —" ? line : `${log.textContent}\n${line}` }

      const TREE = {
        version: 2, sessionID: "ses_tree", updatedAt: Date.now() - 1000,
        phases: ["调研", "设计", "实现", "验证"],
        todos: [
          { content: "调研：现有渲染管线与高度模型", status: "completed", id: "t1", phase: "调研" },
          { content: "设计：树的布局与 gutter 方案", status: "completed", id: "t2", parentId: "t1", phase: "设计" },
          { content: "实现：graph.js 建树与布局", status: "completed", id: "t3", parentId: "t2", phase: "实现" },
          { content: "实现：区块行级 SVG gutter", status: "in_progress", id: "t4", parentId: "t2", phase: "实现" },
          { content: "实现：肘形连接线与祖先主干", status: "pending", id: "t5", parentId: "t4", phase: "实现" },
          { content: "实现：阶段配色与图例", status: "pending", id: "t6", parentId: "t2", phase: "实现" },
          { content: "验证：verify.html 树窗格", status: "pending", id: "t7", phase: "验证" },
          { content: "验证：暗色主题下的对比度", status: "pending", id: "t8", parentId: "t7", phase: "验证", dependsOn: ["t4"] },
          { content: "调研：废弃的旧方案（已完成）", status: "completed", id: "t9", phase: "调研" },
        ],
      }
      const FLAT = {
        version: 2, sessionID: "ses_flat", updatedAt: Date.now(),
        todos: [
          { content: "普通：更新 changelog 与版本号", status: "pending", priority: "low" },
          { content: "次优先：补 check_out 的回归测试", status: "pending", priority: "medium" },
          { content: "已完成：把 CSS 里的颜色收敛到 --oc-*", status: "completed" },
        ],
      }
      const DONE = {
        version: 2, sessionID: "ses_done", updatedAt: Date.now() - 5000,
        phases: ["发布"],
        todos: [
          { content: "发布 v0.6.0", status: "completed", id: "d1", phase: "发布" },
          { content: "写 release notes", status: "completed", id: "d2", parentId: "d1", phase: "发布" },
        ],
      }

      // A flat, phased list (no `parentId`) — like most real mirrors. The tree
      // synthesises one group per phase, so it still indents and draws lines.
      const PHASED = {
        version: 2, sessionID: "ses_phased", updatedAt: Date.now() - 2000,
        phases: ["核查", "实现", "验证"],
        todos: [
          { content: "核查：复核未提交差异", status: "completed", id: "k1", phase: "核查" },
          { content: "实现：补开关样式", status: "completed", id: "k2", phase: "实现" },
          { content: "实现：分批迁移三处开关行", status: "in_progress", id: "k3", phase: "实现" },
          { content: "验证：跑全量测试", status: "pending", id: "k4", phase: "验证" },
        ],
      }

      // The session index the board reads (it may not listDir the folder). As the
      // plugin now writes it: version 2, newest first, each entry carrying a
      // summary so the board renders its bar and headers without opening a mirror.
      const summaryOf = (doc) => {
        const todos = doc.todos || []
        const st = new Map()
        for (const t of todos) if (t.id) st.set(t.id, t.status)
        let done = 0, doing = 0, pending = 0, cancelled = 0, blocked = 0
        const byPhase = {}
        for (const t of todos) {
          if (t.status === "completed") done += 1
          else if (t.status === "in_progress") doing += 1
          else if (t.status === "pending") pending += 1
          else if (t.status === "cancelled") cancelled += 1
          if (Array.isArray(t.dependsOn) && t.dependsOn.some((d) => st.has(d) && st.get(d) !== "completed")) blocked += 1
          const key = t.phase || ""
          byPhase[key] = (byPhase[key] || 0) + 1
        }
        const active = todos.find((t) => t.status === "in_progress")
        const root = todos.find((t) => !t.parentId)
        return { title: (active || root || {}).content || "", total: todos.length, done, doing, pending, cancelled, blocked, byPhase, phases: Array.isArray(doc.phases) ? doc.phases : [] }
      }

      const FILES = { "ses_tree": TREE, "ses_flat": FLAT, "ses_done": DONE, "ses_phased": PHASED }
      const ORDERED = ["ses_tree", "ses_flat", "ses_done", "ses_phased"]
      for (let i = 1; i <= 16; i += 1) {
        const id = `ses_${i}`
        ORDERED.push(id)
        FILES[id] = {
          version: 2, sessionID: id, updatedAt: Date.now() - (i + 1) * 1000,
          phases: ["分析", "实现", "验证"],
          todos: [
            { content: `会话 ${i}：梳理现状`, status: "completed", id: "a", phase: "分析" },
            { content: `会话 ${i}：推进实现`, status: i % 3 === 0 ? "pending" : "in_progress", id: "b", parentId: "a", phase: "实现" },
            { content: `会话 ${i}：补回归测试`, status: "pending", id: "c", phase: "验证" },
          ],
        }
      }
      FILES._index = { version: 2, sessions: ORDERED.map((id, index) => ({ sessionID: id, updatedAt: Date.now() - index * 500, ...summaryOf(FILES[id]) })) }
      // A query parameter makes one mirror unreadable, so the board's failure
      // card and retry path are checkable; `window.__broken = null` heals it.
      window.__broken = new URLSearchParams(location.search).get("broken")

      const LIGHT = {
        background: "#fffcf0", elevated: "#fffcf0", foreground: "#100f0f", muted: "#6f6e69",
        subtle: "#e6e4d9", border: "#dad8ce", hover: "rgba(0,0,0,.04)", selection: "rgba(32,94,166,.14)",
        focus: "#205ea6", primary: "#205ea6", mutedSurface: "#f2f0e5", elevatedForeground: "#100f0f",
        active: "rgba(0,0,0,.06)", selectionForeground: "inherit", primaryForeground: "#ffffff",
        primaryText: "#205ea6", successText: "#66800b", warningText: "#bc5215", errorText: "#af3029",
        infoText: "#3a7bbf", success: "#66800b", warning: "#bc5215", error: "#af3029", info: "#3a7bbf",
        font: "ui-sans-serif, -apple-system, system-ui, sans-serif", mono: "ui-monospace, monospace",
        radius: "9px",
      }
      const DARK = {
        background: "#171614", elevated: "#1f1e1c", foreground: "#e6e4d9", muted: "#a8a69f",
        subtle: "#24231f", border: "#3a3833", hover: "rgba(255,255,255,.06)", selection: "rgba(79,156,240,.24)",
        focus: "#4f9cf0", primary: "#4f9cf0", mutedSurface: "#24231f", elevatedForeground: "#e6e4d9",
        active: "rgba(255,255,255,.08)", selectionForeground: "inherit", primaryForeground: "#0b0b0a",
        primaryText: "#7cb7ff", successText: "#9fbf4a", warningText: "#e0a35a", errorText: "#f07a75",
        infoText: "#78b6ff", success: "#8faa3a", warning: "#d18b45", error: "#e06c67", info: "#4f9cf0",
        font: LIGHT.font, mono: LIGHT.mono, radius: LIGHT.radius,
      }
      const THEME = new URLSearchParams(location.search).has("dark") ? DARK : LIGHT
      const ready = (surface, sessionID) => ({
        theme: { mode: THEME === DARK ? "dark" : "light", tokens: THEME },
        locale: "zh", directory: null,
        session: sessionID ? { id: sessionID, title: "demo", busy: false } : null,
        surface, item: null, connection: { connected: false }, settings: {},
      })

      const registry = new Map()
      // The board keeps its session archive in `host.storage`; the stub answers it
      // from memory so a bulk-archive / restore round trip is checkable here.
      const STORE = new Map()
      // Pre-seed the auto sweep OFF so the manual bulk/undo probe below is
      // deterministic. The dedicated auto-sweep probe later clears the store and
      // reloads the board, exercising the real default (on) on a clean slate.
      STORE.set("archive:prefs", { version: 1, auto: false })

      window.addEventListener("message", (event) => {
        const entry = registry.get(event.source)
        if (!entry) return
        const msg = event.data
        if (!msg || msg.channel !== CHANNEL || msg.v !== V) return
        const answer = (payload) => entry.iframe.contentWindow.postMessage(payload, "*")
        const ok = (payload) => answer({ channel: CHANNEL, v: V, type: "result", id: msg.id, ok: true, payload })

        if (msg.type === "hello") { answer({ channel: CHANNEL, v: V, type: "ready", payload: ready(entry.surface, entry.sessionID) }); return }
        // The board asks the host for real chat titles once per page. Answer with
        // deterministic labels so the fallback and the overlay are both checkable.
        if (msg.type === "workspace-read") {
          const query = msg.payload || {}
          if (query.kind === "projects") {
            ok({ kind: "projects", state: "ready", projects: [{ id: "p1", name: "Demo", directory: "/demo" }] })
            return
          }
          if (query.kind === "sessions") {
            const sessions = ORDERED.map((id, index) => ({
              id, title: `真实会话 ${index + 1}`, projectId: query.projectId, directory: "/demo",
              parentId: null, createdAt: 0, updatedAt: Date.now() - index * 500, archivedAt: null,
              worktree: null, activity: "idle", outcome: null, items: [],
            }))
            ok({ kind: "sessions", projectId: query.projectId, state: "ready", coverage: [{ directory: "/demo", state: "ready" }], sessions })
            return
          }
        }
        if (msg.type === "file-read") {
          const path = (msg.payload && msg.payload.path) || ""
          const id = path.split("/").pop().replace(/\.json$/, "")
          if (window.__broken === id) {
            say(`file-read ${id} (broken)`)
            ok({ content: "{broken" })
            return
          }
          const data = FILES[id]
          if (!data) { answer({ channel: CHANNEL, v: V, type: "result", id: msg.id, ok: false, code: "NOT_FOUND", error: "stub: no such file" }); return }
          say(`file-read ${id}`)
          ok({ content: JSON.stringify(data) })
          return
        }
        // The board stats the index before reading it, so a quiet poll is a stat
        // rather than a parse. A constant mtime keeps the stub's data "unchanged".
        if (msg.type === "file-stat") {
          const path = (msg.payload && msg.payload.path) || ""
          const id = path.split("/").pop().replace(/\.json$/, "")
          if (!FILES[id]) { answer({ channel: CHANNEL, v: V, type: "result", id: msg.id, ok: false, code: "NOT_FOUND", error: "stub: no such file" }); return }
          ok({ kind: "file", size: 4096, mtime: 1 })
          return
        }
        if (msg.type === "file-list") {
          say("file-list")
          ok({ entries: Object.keys(FILES).map((name) => ({ name: `${name}.json`, kind: "file" })) })
          return
        }
        if (msg.type === "compose") { say(`compose: ${((msg.payload || {}).text || "").slice(0, 40)}…`); ok({}); return }
        if (msg.type === "open-session") { say(`open-session: ${(msg.payload || {}).sessionId || ""}`); ok({}); return }
        if (msg.type === "clipboard-write") { say("clipboard-write"); ok({}); return }
        if (msg.type === "toast") { say(`toast: ${(msg.payload || {}).message || ""}`); ok({}); return }
        if (msg.type === "resize") { ok({}); return }
        if (msg.type === "storage") {
          const { op, key, value } = msg.payload || {}
          if (op === "get") { ok(STORE.has(key) ? { storage: true, op: "get", found: true, value: STORE.get(key) } : { storage: true, op: "get", found: false }); return }
          if (op === "set") { STORE.set(key, value); say(`storage.set ${key}`); ok({ storage: true, op: "set" }); return }
          if (op === "delete") { STORE.delete(key); ok({ storage: true, op: "delete" }); return }
          if (op === "keys") { ok({ storage: true, op: "keys", keys: [...STORE.keys()] }); return }
        }
        if (typeof msg.id === "string") ok({})
      })

      function mount(id, surface, sessionID) {
        const iframe = document.getElementById(id)
        registry.set(iframe.contentWindow, { iframe, surface, sessionID })
        iframe.src = surface === "page" ? "/board/index.html" : "/panel/index.html"
      }
      mount("panel", "panel", "ses_tree")
      mount("board", "page", "ses_phased")

      // Prune check: finished work is hidden by default.
      setTimeout(() => {
        try {
          const pdoc = document.getElementById("panel").contentDocument
          const bdoc = document.getElementById("board").contentDocument
          say("panel list: " + pdoc.getElementById("list").textContent.replace(/\s+/g, " ").trim().slice(0, 90))
          say("ses_flat rows: " + bdoc.querySelectorAll('[data-session="ses_flat"] .row').length)
          say("ses_done: " + (bdoc.querySelector('[data-session="ses_done"] .note') ? "hidden-note" : "rows shown"))
          say("ses_phased rows: " + bdoc.querySelectorAll('[data-session="ses_phased"] .row').length + " | group rows: " + bdoc.querySelectorAll('[data-session="ses_phased"] .row.group').length)
        } catch (error) {
          say("prune probe error: " + error)
        }
      }, 2600)

      // The panel's "jump to session" button: present and wired when a session is open.
      setTimeout(() => {
        try {
          const pdoc = document.getElementById("panel").contentDocument
          const host = pdoc.getElementById("jumpHost")
          const button = host && host.querySelector("button")
          say(`panel jump: ${host ? (host.hidden ? "hidden" : "shown") : "missing"} / ${button ? "button ok" : "no button"}`)
          if (button) button.click()
        } catch (error) {
          say("panel probe error: " + error)
        }
      }, 2800)

      // From inside the harness (the iframes are same-origin) drive the real
      // pages: dump the summary, click a row for the detail, then focus one
      // session via the board's own session select.
      setTimeout(() => {
        try {
          const doc = document.getElementById("board").contentDocument
          const text = (id) => (doc.getElementById(id) || { textContent: "(none)" }).textContent.replace(/\s+/g, " ").trim()
          say("summary: " + text("summary").slice(0, 170))
          const rows = Array.from(doc.querySelectorAll('[data-session="ses_tree"] .row'))
          const row = rows.find((r) => r.textContent.includes("暗色")) || rows[0]
          if (!row) {
            say(`peek: no rows for ses_tree (${rows.length})`)
            return
          }
          row.dispatchEvent(new MouseEvent("click", { bubbles: true }))
          setTimeout(() => {
            say("details: " + text("details").slice(0, 200))
            say("detail actions: " + Array.from(doc.querySelectorAll("#detailActions button")).map((b) => b.textContent).join(" / "))
            const selects = doc.querySelectorAll(".oc-sdk-select")
            const pick = (index, match, then) => {
              const trigger = selects[index] && selects[index].querySelector(".oc-sdk-trigger")
              if (!trigger) { say("select missing: " + index); return }
              trigger.click()
              setTimeout(() => {
                const option = Array.from(doc.querySelectorAll('[role="option"]')).find((o) => o.textContent.includes(match))
                if (!option) { say("option not found: " + match); return }
                option.click()
                setTimeout(then, 300)
              }, 250)
            }
            pick(0, "分批迁移", () => {
              say("sessions shown: " + doc.querySelectorAll(".sess").length + " | swimlane svg: " + doc.querySelectorAll(".swim svg").length)
              say("scope tabs: " + Array.from(doc.querySelectorAll("#scopeHost [role=tab]")).map((t) => t.textContent).join(" / "))
            })
          }, 400)
        } catch (error) {
          say("peek error: " + error)
        }
      }, 3200)

      // Windowing: the board pins the current session and shows one batch at a
      // time, loading the rest only as the list is scrolled to its end.
      setTimeout(() => {
        try {
          const doc = document.getElementById("board").contentDocument
          const board = doc.getElementById("sessions")
          const count = () => doc.querySelectorAll("#sessions .sess").length
          const pinAct = doc.querySelector("#sessions .sess.pinned .sess-act")
          say(`paging: pinned=${doc.querySelectorAll("#sessions .sess.pinned").length} cards=${count()} sentinel=${doc.getElementById("sentinel") ? "yes" : "no"} pinnedAction="${pinAct ? pinAct.textContent : "none"}" divider="${((doc.querySelector(".divider") || {}).textContent || "").trim()}"`)
          board.scrollTop = board.scrollHeight
          setTimeout(() => {
            say(`after scroll: cards=${count()} sentinel=${doc.getElementById("sentinel") ? "yes" : "no"} endnote=${doc.querySelector(".endnote") ? "yes" : "no"}`)
          }, 1500)
        } catch (error) {
          say("paging probe error: " + error)
        }
      }, 3800)

      // Archive: reset the session filter to "all" (an earlier probe narrows it to
      // one session, where there is no fold), open the archive popover, run the
      // manual bulk action, open the fold, and restore one. The stub answers
      // `storage`, so the whole round trip runs without OpenChamber.
      setTimeout(() => {
        const doc = document.getElementById("board").contentDocument
        const note = (m) => say("archive: " + m)
        const foldText = () => {
          const el = doc.getElementById("archiveToggle")
          return el ? el.textContent.replace(/\s+/g, " ").trim() : "(none)"
        }
        const selects = () => Array.from(doc.querySelectorAll(".oc-sdk-trigger")).map((t) => t.textContent.replace(/\s+/g, " ").trim()).join(" | ")
        const archCards = () => doc.querySelectorAll("#sessions .sess.archived").length
        const restoreBtn = () => doc.querySelector("#sessions .sess.archived [data-restore]")
        try {
          const sessionTrigger = doc.querySelectorAll(".oc-sdk-trigger")[0]
          if (!sessionTrigger) { note("no session select"); return }
          sessionTrigger.click()
          setTimeout(() => {
            try {
              const all = Array.from(doc.querySelectorAll('[role="option"]')).find((o) => o.textContent.trim() === "全部会话")
              if (!all) { note("no 全部会话 option"); return }
              all.click()
              setTimeout(() => {
                try {
                  note("selects: " + selects())
                  const trigger = doc.querySelector("#archiveHost button")
                  note("popover trigger: " + (trigger ? trigger.textContent : "missing"))
                  if (!trigger) return
                  trigger.click()
                  setTimeout(() => {
                    const manual = doc.getElementById("apManual")
                    note("manual button: " + (manual ? manual.textContent : "missing"))
                    if (!manual) return
                    manual.click()
                    setTimeout(() => {
                      try {
                        note(`after manual → fold="${foldText()}" archivedCards=${archCards()} undoBar=${doc.getElementById("undoBtn") ? "yes" : "no"}`)
                        const toggle = doc.getElementById("archiveToggle")
                        if (!toggle) { note("no fold to open"); return }
                        toggle.click()
                        setTimeout(() => {
                          try {
                            const t2 = doc.getElementById("archiveToggle")
                            note(`after expand → aria=${t2 ? t2.getAttribute("aria-expanded") : "no-toggle"} archivedCards=${archCards()} restoreBtn=${restoreBtn() ? "yes" : "no"}`)
                            const restore = restoreBtn()
                            if (!restore) { note("no restore button to click"); return }
                            restore.click()
                            setTimeout(() => {
                              try {
                                note(`after restore → fold=${doc.getElementById("archiveToggle") ? "present" : "gone"} archivedCards=${archCards()}`)
                                // Leave the restored card at the end of the list, so a
                                // person (or a screenshot) sees it back in "recent".
                                const boardList = doc.getElementById("sessions")
                                if (boardList) boardList.scrollTop = boardList.scrollHeight
                              } catch (error) { say("archive restore probe error: " + error) }
                            }, 800)
                          } catch (error) { say("archive expand probe error: " + error) }
                        }, 800)
                      } catch (error) { say("archive bulk probe error: " + error) }
                    }, 800)
                  }, 300)
                } catch (error) { say("archive click probe error: " + error) }
              }, 500)
            } catch (error) { say("archive all-pick error: " + error) }
          }, 350)
        } catch (error) {
          say("archive probe error: " + error)
        }
      }, 9000)

      // Auto-archive (default on): wipe the stub's storage and reload the board, so
      // the sweep runs on a clean slate — nothing is set aside beforehand. A finished
      // session must be filed away on its own, with no bulk click, and the toggle
      // must persist its opt-out to `archive:prefs`.
      setTimeout(() => {
        const note = (m) => say("auto-sweep: " + m)
        try {
          STORE.clear()
          // The sweep's default is now a 7-day age gate. The fixture sessions are
          // recent, so pin "no age gate" to keep this probe about the sweep itself.
          STORE.set("archive:prefs", { version: 2, auto: true, days: 0 })
          const frame = document.getElementById("board")
          frame.src = "/board/index.html"
          registry.set(frame.contentWindow, { iframe: frame, surface: "page", sessionID: "ses_phased" })
          setTimeout(() => {
            try {
              const doc = frame.contentDocument
              const toggle = doc.getElementById("archiveToggle")
              if (toggle) toggle.click()
              setTimeout(() => {
                try {
                  const ids = Array.from(doc.querySelectorAll("#sessions .sess.archived")).map((s) => s.dataset.session)
                  const stored = STORE.get("archive")
                  note(`on load → fold="${toggle ? toggle.textContent.replace(/\s+/g, " ").trim() : "(none)"}"` +
                    ` archived=[${ids.join(",")}] stored=[${stored ? Object.keys(stored.sessions || {}).join(",") : ""}]`)
                  const trigger = doc.querySelector("#archiveHost button")
                  if (trigger) trigger.click()
                  setTimeout(() => {
                    const cb = doc.getElementById("apAuto")
                    if (!cb) { note("no auto checkbox"); return }
                    cb.click()
                    setTimeout(() => {
                      const pref = STORE.get("archive:prefs")
                      note(`after toggle off → pref.auto=${pref ? pref.auto : "(unset)"}`)
                    }, 700)
                  }, 250)
                } catch (error) { say("auto-sweep expand error: " + error) }
              }, 900)
            } catch (error) { say("auto-sweep reload error: " + error) }
          }, 5200)
        } catch (error) { say("auto-sweep probe error: " + error) }
      }, 15000)
    </script>
  </body>
</html>
