<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      /*
        Colour comes from the host's `--oc-*` variables, written onto the frame
        root by `applyHostReady` (see src/main.js). The inline fallbacks mirror
        the light theme so the section is still readable if the theme has not
        been applied yet — e.g. on the very first paint.
        The names below are the ones the SDK actually defines:
        --oc-fg, --oc-muted, --oc-border, --oc-warning-text.
      */
      :root {
        --todo-fg: var(--oc-fg, #1f2328);
        --todo-muted: var(--oc-muted, #656d76);
        --todo-border: var(--oc-border, #d0d7de);
        --todo-warning: var(--oc-warning-text, #9a6700);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 12px/1.45 var(--oc-font, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif);
        background: transparent;
        color: var(--todo-fg);
        overflow: hidden;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      #head {
        flex: 0 0 auto;
        padding: 2px 8px 4px;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: .01em;
        color: var(--todo-muted);
      }
      #body { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 6px; }
      .row { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
      .mark {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        color: var(--todo-muted);
      }
      .text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .pri {
        flex: 0 0 auto; font-size: 9px; text-transform: uppercase;
        letter-spacing: .04em; color: var(--todo-muted); padding-top: 2px;
      }
      /* Finished work recedes: struck through and dimmed. */
      .row.completed .text,
      .row.cancelled .text { text-decoration: line-through; color: var(--todo-muted); }
      .row.cancelled { opacity: .6; }
      .row.in_progress { font-weight: 600; }
      .row.in_progress .mark { color: var(--todo-warning); }
      .empty { color: var(--todo-muted); padding: 2px 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="head">Todo</div>
      <div id="body"><div class="empty">Loading…</div></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
