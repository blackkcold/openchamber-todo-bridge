<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      /*
        Checklist styling for the Work Status section.

        Colour comes from the host's `--oc-*` variables, written onto the frame
        root by `applyHostReady` (see src/main.js). The inline fallbacks mirror
        the light theme so the section stays readable before the theme lands.
        Names below are the ones the SDK actually defines — `--oc-fg`,
        `--oc-muted`, `--oc-border`, `--oc-success`, `--oc-primary`,
        `--oc-error`, `--oc-warning`, `--oc-hover`, `--oc-font`.

        The checkbox is sized to match the SDK's `.oc-sdk-check-box` (14px, 4px
        radius) so the section reads as part of the app, and the tick is drawn
        in CSS rather than pulled from an icon font the frame cannot load.
      */
      :root {
        --t-fg: var(--oc-fg, #100f0f);
        --t-muted: var(--oc-muted, #6f6e69);
        --t-border: var(--oc-border, #dad8ce);
        --t-primary: var(--oc-primary, #205ea6);
        --t-success: var(--oc-success, #66800b);
        --t-warning: var(--oc-warning, #bc5215);
        --t-error: var(--oc-error, #af3029);
        --t-hover: var(--oc-hover, rgba(0, 0, 0, .035));
        --t-motion-fast: 160ms;
        --t-motion-row: 220ms;
        /*
          Springs sampled from a damped harmonic (the same curve src/main.js uses
          for WAAPI), so CSS transitions and JS animations share one physics:
          travel eases ~9% overshoot, the tick/absorb pulse ~20%. `linear()` is
          supported from Chrome 113; older hosts fall back to a plain linear ramp,
          which still animates, just without the bounce.
        */
        --t-motion-spring: linear(0, 0.03 3.1%, 0.106 6.3%, 0.211 9.4%, 0.333 12.5%, 0.459 15.6%, 0.582 18.8%, 0.695 21.9%, 0.795 25%, 0.88 28.1%, 0.949 31.3%, 1.002 34.4%, 1.041 37.5%, 1.067 40.6%, 1.082 43.8%, 1.089 46.9%, 1.088 50%, 1.083 53.1%, 1.075 56.3%, 1.065 59.4%, 1.053 62.5%, 1.042 65.6%, 1.032 68.8%, 1.022 71.9%, 1.014 75%, 1.007 78.1%, 1.002 81.3%, 0.998 84.4%, 0.995 87.5%, 0.993 90.6%, 0.992 93.8%, 0.992 96.9%, 0.992 100%);
        --t-motion-spring-snappy: linear(0, 0.038 3.1%, 0.137 6.3%, 0.275 9.4%, 0.434 12.5%, 0.597 15.6%, 0.752 18.8%, 0.889 21.9%, 1.002 25%, 1.089 28.1%, 1.15 31.3%, 1.185 34.4%, 1.199 37.5%, 1.196 40.6%, 1.179 43.8%, 1.153 46.9%, 1.122 50%, 1.089 53.1%, 1.057 56.3%, 1.029 59.4%, 1.005 62.5%, 0.986 65.6%, 0.973 68.8%, 0.964 71.9%, 0.96 75%, 0.96 78.1%, 0.963 81.3%, 0.968 84.4%, 0.974 87.5%, 0.98 90.6%, 0.987 93.8%, 0.993 96.9%, 0.998 100%);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 12px/1.45 var(--oc-font, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif);
        background: transparent;
        color: var(--t-fg);
        overflow: hidden;
      }
      #root { height: 100%; display: flex; flex-direction: column; position: relative; }

      /* Ghosts from the completion flight live above both the header and the
         scrolling list, so a row can fly to the toggle in the header without
         the list clipping it on the way out. */
      #ghosts {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 3;
      }

      /* ---- header: toggle, count, progress ---- */
      #top { flex: 0 0 auto; padding: 6px 10px 6px; }
      #head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 24px;
      }
      #count {
        display: block;
        /* The count keeps the right edge it has always had; the toggle takes the
           left, where a control cannot run into the frame's rounded corner. */
        margin-left: auto;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        color: var(--t-muted);
        line-height: 1.2;
      }
      /* ---- finished toggle ----
        A soft pill rather than an outline: the header already carries a rule
        (the progress bar), and a hairline border on top of it read as clutter.
        The count sits in its own badge so the number reads first, and the
        chevron is an SVG so its stroke stays crisp at 9px. The surface mixes
        `currentColor`, which is the one thing the host guarantees in both
        themes; a hard-coded tint would vanish on dark. */
      #finished {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        height: 24px;
        margin: 0;
        padding: 0 12px 0 10px;
        border: 0;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 10%, transparent);
        color: var(--t-muted);
        font: inherit;
        font-size: 10px;
        line-height: 1;
        letter-spacing: .02em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 140ms ease, color 140ms ease;
      }
      #finished[hidden] { display: none; }
      #finished:hover, #finished[aria-expanded="true"] {
        background: color-mix(in srgb, currentColor 16%, transparent);
        color: var(--t-fg);
      }
      #finished:focus-visible { outline: 2px solid var(--t-primary); outline-offset: 2px; }
      #finished .lbl { display: inline-flex; align-items: center; }
      #finished .n {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 17px;
        height: 17px;
        margin: 0 5px;
        padding: 0 4px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--t-success) 18%, transparent);
        color: var(--t-success);
        font-size: 9px;
        line-height: 1;
        letter-spacing: 0;
      }
      #finished .cv {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        transition: transform 160ms var(--t-motion-spring, linear);
      }
      #finished[aria-expanded="true"] .cv { transform: rotate(90deg); }
      #bar {
        height: 2px;
        margin-top: 2px;
        border-radius: 999px;
        background: var(--t-border);
        overflow: hidden;
        position: relative;
      }
      #bar > i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: var(--t-success);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 260ms var(--t-motion-spring, linear);
      }
      /* All done: one light sweep across the bar, replayed only when the state
         changes (data-full toggles, not repaints). */
      #bar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, .65) 50%, transparent 80%);
        transform: translateX(-120%);
        pointer-events: none;
      }
      #bar[data-full="true"]::after { animation: todo-bar-shine 700ms ease-out 180ms both; }
      @keyframes todo-bar-shine {
        from { transform: translateX(-120%); }
        to { transform: translateX(120%); }
      }
      #top[data-empty="true"] { display: none; }

      /* ---- list ----
        The frame is elastic: sized to its content by the section itself
        (`setHeight`), up to the host's 320px ceiling. Past that the body is an
        ordinary scroll container: the native scrollbar and native wheel/key
        handling, no paging.

        `min-height: 0` is what lets a column flex child actually scroll — with
        the default `min-height: auto` the body grows to its content and the
        overflow never triggers. `scrollbar-gutter: stable` keeps the text
        column the same width whether or not the bar is there, so a bar
        appearing cannot re-wrap a row and change the height that caused it.

        In `empty` mode the body is content-sized instead, which is how the
        section measures its own empty/message state — no list, no scrolling.
      */
      #body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        position: relative;
        scrollbar-gutter: stable;
        padding: 0 8px 6px;
      }
      #root[data-mode="empty"] #body {
        flex: 0 0 auto;
        min-height: auto;
        overflow: visible;
      }

      .item {
        display: flex;
        gap: 7px;
        align-items: flex-start;
        padding: 3px 2px;
        border-radius: 5px;
        transition: transform var(--t-motion-row) var(--t-motion-spring, linear), opacity var(--t-motion-fast) ease-out;
      }
      .box {
        flex: 0 0 auto;
        width: 13px; height: 13px;
        margin-top: 3px;
        border: 1.5px solid var(--t-border);
        border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
        transition: border-color var(--t-motion-fast) ease-out, background-color var(--t-motion-fast) ease-out;
      }
      .txt {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: anywhere;
        position: relative;
        transition: color var(--t-motion-fast) ease-out;
      }
      .type-char {
        display: inline;
        animation: todo-type-char 18ms steps(1, end) var(--type-delay, 0ms) both;
      }
      @keyframes todo-type-char {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .strike-sweep {
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left center;
        pointer-events: none;
      }
      .completion-ghost { pointer-events: none; }

      /* in progress */
      .item.in_progress .txt { font-weight: 600; }
      .item.in_progress .box { border-color: var(--t-primary); }
      .item.in_progress .dot {
        width: 5px; height: 5px; border-radius: 999px;
        background: var(--t-primary);
        animation: todo-dot-breathe 2200ms ease-in-out infinite;
      }
      @keyframes todo-dot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.45); }
      }

      /* finished (completed + cancelled) */
      .item.completed .txt,
      .item.cancelled .txt { color: var(--t-muted); text-decoration: line-through; }
      .item.cancelled { opacity: .65; }
      .item.completed .box {
        border-color: var(--t-success);
        background: color-mix(in srgb, var(--t-success) 14%, transparent);
      }
      .item.completed .tick {
        width: 7px; height: 4px;
        border-left: 1.5px solid var(--t-success);
        border-bottom: 1.5px solid var(--t-success);
        position: relative; top: -0.5px;
        transform: rotate(-45deg);
        transform-origin: center;
      }
      .item.just-completed .tick { animation: todo-tick-in 260ms var(--t-motion-spring-snappy, linear) both; }
      @keyframes todo-tick-in {
        from { opacity: 0; transform: rotate(-45deg) scale(.45); }
        to { opacity: 1; transform: rotate(-45deg) scale(1); }
      }
      .item.cancelled .dash { width: 6px; height: 1.5px; background: var(--t-muted); }

      /*
        Priority reads as a rising mark rather than a label: two chevrons for the
        top level, one for the next, a dot for ordinary work. These are real
        characters (U+2303, U+00B7) rather than CSS-drawn shapes: a rotated box
        has ~7px of ink inside a 5px box, so two of them either overflow the line
        or fuse into a single blob. A glyph brings its own metrics.

        The host palette has no purple, so the priority colours are defined here.
        `applyHostReady` sets `data-oc-theme` on the root, which gives the dark
        variant; the `:root` values are the light ones and double as the
        pre-theme fallback. Values are Flexoki, the palette the app uses.
      */
      :root {
        --t-pri-high: #5e409d;
        --t-pri-medium: #205ea6;
      }
      [data-oc-theme="dark"] {
        --t-pri-high: #8b7ec8;
        --t-pri-medium: #4385be;
      }
      .pri {
        flex: 0 0 auto;
        min-width: 9px;
        /*
          Share the text's line box so the glyph rides the same baseline as the
          task: `⌃` sits above the baseline and `·` at mid-x-height, which is the
          natural alignment. An independent line-height here pushed the mark to
          the top of the row.
        */
        font-size: 11px;
        line-height: 17.4px;
        text-align: center;
        color: var(--t-muted);
      }
      .pri.high { color: var(--t-pri-high); }
      .pri.medium { color: var(--t-pri-medium); }
      /* The pair should read as one mark, not two separate characters. */
      .pri.high { letter-spacing: -1px; }

      /* ---- finished group toggle ----
        Its styling moved to the header (`#finished`), next to the count. The
        list no longer carries a control row of its own, which is why the frame
        height is now the last task row's bottom edge.
      */

      .empty { color: var(--t-muted); padding: 2px 0; }

      /* ---- legend: colour = stage ---- */
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        margin-top: 3px;
        font-size: 10px;
        color: var(--t-muted);
      }
      #legend[hidden] { display: none; }
      .lg { display: inline-flex; align-items: center; gap: 4px; }
      .lg > i { width: 7px; height: 7px; border-radius: 999px; flex: 0 0 auto; }

      /* ---- tree rows ----
        A structured row carries a gutter: the elbow connectors, the ancestor
        trunks, and this node's status symbol, all in one inline SVG. The shared
        `.gut*` CSS is injected by `src/gutter.js`; this page owns only the row's
        own alignment and the completion tick, which are specific to the
        section's animation. The symbol's colour is the phase and its shape is
        the status. */
      .item.tree { align-items: flex-start; }
      .item.tree.group .txt { font-weight: 600; }
      .item.tree.just-completed .gut-tick { animation: todo-tick-in 260ms var(--t-motion-spring-snappy, linear) both; }

      @media (prefers-reduced-motion: reduce) {
        #bar > i, .item, .item .box, .item .txt, #finished .cv { transition: none; }
        #bar::after, .item.in_progress .dot { animation: none; }
        .item.just-completed .tick, .item.tree.just-completed .gut-tick { animation: none; }
        .type-char { animation: none !important; opacity: 1; }
        .strike-sweep { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-mode="empty">
      <div id="top" data-empty="true">
        <div id="head">
          <button id="finished" type="button" aria-expanded="false" aria-controls="body" hidden><svg class="cv" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.4 1.6 6.9 5l-3.5 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">已完成 <span id="finishedN" class="n">0</span> 项</span></button>
          <span id="count"></span>
        </div>
        <div id="bar"><i></i></div>
        <div id="legend" hidden></div>
      </div>
      <div id="body" tabindex="0"><div class="empty">Loading…</div></div>
      <div id="ghosts" aria-hidden="true"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
