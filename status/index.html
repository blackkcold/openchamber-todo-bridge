<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      /*
        Checklist styling for the Work Status section.

        Colour comes from the host's `--oc-*` variables, written onto the frame
        root by `applyHostReady` (see src/main.js). The inline fallbacks mirror
        the light theme so the section stays readable before the theme lands.
        Names below are the ones the SDK actually defines — `--oc-fg`,
        `--oc-muted`, `--oc-border`, `--oc-success`, `--oc-primary`,
        `--oc-error`, `--oc-warning`, `--oc-hover`, `--oc-font`.

        The checkbox is sized to match the SDK's `.oc-sdk-check-box` (14px, 4px
        radius) so the section reads as part of the app, and the tick is drawn
        in CSS rather than pulled from an icon font the frame cannot load.
      */
      :root {
        --t-fg: var(--oc-fg, #100f0f);
        --t-muted: var(--oc-muted, #6f6e69);
        --t-border: var(--oc-border, #dad8ce);
        --t-primary: var(--oc-primary, #205ea6);
        --t-success: var(--oc-success, #66800b);
        --t-warning: var(--oc-warning, #bc5215);
        --t-error: var(--oc-error, #af3029);
        --t-hover: var(--oc-hover, rgba(0, 0, 0, .035));
        --t-motion-fast: 160ms;
        --t-motion-row: 220ms;
        --t-motion-ease: cubic-bezier(.22, 1, .36, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 12px/1.45 var(--oc-font, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif);
        background: transparent;
        color: var(--t-fg);
        overflow: hidden;
      }
      #root { height: 100%; display: flex; flex-direction: column; }

      /* ---- header: count + progress ---- */
      #top { flex: 0 0 auto; padding: 0 8px 6px; }
      #count {
        display: block;
        text-align: right;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        color: var(--t-muted);
        line-height: 1.2;
      }
      #bar {
        height: 2px;
        margin-top: 2px;
        border-radius: 999px;
        background: var(--t-border);
        overflow: hidden;
      }
      #bar > i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: var(--t-success);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 200ms var(--t-motion-ease);
      }
      #top[data-empty="true"] { display: none; }

      /* ---- list ----
        The frame is elastic: sized to its content by the section itself
        (`setHeight`), up to the host's 320px ceiling. Past that the body is an
        ordinary scroll container: the native scrollbar and native wheel/key
        handling, no paging.

        `min-height: 0` is what lets a column flex child actually scroll — with
        the default `min-height: auto` the body grows to its content and the
        overflow never triggers. `scrollbar-gutter: stable` keeps the text
        column the same width whether or not the bar is there, so a bar
        appearing cannot re-wrap a row and change the height that caused it.

        In `empty` mode the body is content-sized instead, which is how the
        section measures its own empty/message state — no list, no scrolling.
      */
      #body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        position: relative;
        scrollbar-gutter: stable;
        padding: 0 8px 6px;
      }
      #root[data-mode="empty"] #body {
        flex: 0 0 auto;
        min-height: auto;
        overflow: visible;
      }

      .item {
        display: flex;
        gap: 7px;
        align-items: flex-start;
        padding: 3px 2px;
        border-radius: 5px;
        transition: transform var(--t-motion-row) var(--t-motion-ease), opacity var(--t-motion-fast) ease-out;
      }
      .box {
        flex: 0 0 auto;
        width: 13px; height: 13px;
        margin-top: 3px;
        border: 1.5px solid var(--t-border);
        border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
        transition: border-color var(--t-motion-fast) ease-out, background-color var(--t-motion-fast) ease-out;
      }
      .txt {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: anywhere;
        transition: color var(--t-motion-fast) ease-out;
      }

      /* in progress */
      .item.in_progress .txt { font-weight: 600; }
      .item.in_progress .box { border-color: var(--t-primary); }
      .item.in_progress .dot {
        width: 5px; height: 5px; border-radius: 999px;
        background: var(--t-primary);
      }

      /* finished (completed + cancelled) */
      .item.completed .txt,
      .item.cancelled .txt { color: var(--t-muted); text-decoration: line-through; }
      .item.cancelled { opacity: .65; }
      .item.completed .box {
        border-color: var(--t-success);
        background: color-mix(in srgb, var(--t-success) 14%, transparent);
      }
      .item.completed .tick {
        width: 7px; height: 4px;
        border-left: 1.5px solid var(--t-success);
        border-bottom: 1.5px solid var(--t-success);
        transform: rotate(-45deg) translateY(-1px);
        transform-origin: center;
      }
      .item.just-completed .tick { animation: todo-tick-in 180ms var(--t-motion-ease) both; }
      @keyframes todo-tick-in {
        from { opacity: 0; transform: rotate(-45deg) translateY(-1px) scale(.45); }
        to { opacity: 1; transform: rotate(-45deg) translateY(-1px) scale(1); }
      }
      .item.cancelled .dash { width: 6px; height: 1.5px; background: var(--t-muted); }

      /*
        Priority reads as a rising mark rather than a label: two chevrons for the
        top level, one for the next, a dot for ordinary work. These are real
        characters (U+2303, U+00B7) rather than CSS-drawn shapes: a rotated box
        has ~7px of ink inside a 5px box, so two of them either overflow the line
        or fuse into a single blob. A glyph brings its own metrics.

        The host palette has no purple, so the priority colours are defined here.
        `applyHostReady` sets `data-oc-theme` on the root, which gives the dark
        variant; the `:root` values are the light ones and double as the
        pre-theme fallback. Values are Flexoki, the palette the app uses.
      */
      :root {
        --t-pri-high: #5e409d;
        --t-pri-medium: #205ea6;
      }
      [data-oc-theme="dark"] {
        --t-pri-high: #8b7ec8;
        --t-pri-medium: #4385be;
      }
      .pri {
        flex: 0 0 auto;
        min-width: 9px;
        /*
          Share the text's line box so the glyph rides the same baseline as the
          task: `⌃` sits above the baseline and `·` at mid-x-height, which is the
          natural alignment. An independent line-height here pushed the mark to
          the top of the row.
        */
        font-size: 11px;
        line-height: 17.4px;
        text-align: center;
        color: var(--t-muted);
      }
      .pri.high { color: var(--t-pri-high); }
      .pri.medium { color: var(--t-pri-medium); }
      /* The pair should read as one mark, not two separate characters. */
      .pri.high { letter-spacing: -1px; }

      /* ---- finished group toggle ----
        Rendered as the last row of the open list: one line box with the same
        padding as a task row, plus a 4px gap above it. That 4px, and the fold
        being a control rather than a line of text, is exactly why the frame is
        measured from the rendered rows instead of trusting `rows x rowH`.
      */
      .fold {
        display: block;
        width: 100%;
        margin: 4px 0 0;
        padding: 3px 2px;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--t-muted);
        font: inherit;
        font-size: 11px;
        text-align: left;
        cursor: pointer;
        transition: transform var(--t-motion-row) var(--t-motion-ease);
      }
      .fold:hover { background: var(--t-hover); }
      .fold::before {
        display: inline-block;
        width: 8px;
        content: "▸";
        transform-origin: center;
        transition: transform var(--t-motion-fast) var(--t-motion-ease);
      }
      .fold[aria-expanded="true"]::before { transform: rotate(90deg); }

      .empty { color: var(--t-muted); padding: 2px 0; }
      @media (prefers-reduced-motion: reduce) {
        #bar > i, .item, .item .box, .item .txt, .fold, .fold::before { transition: none; }
        .item.just-completed .tick { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-mode="empty">
      <div id="top" data-empty="true">
        <span id="count"></span>
        <div id="bar"><i></i></div>
      </div>
      <div id="body" tabindex="0"><div class="empty">Loading…</div></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
