<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      /*
        The rail panel: the current session's task tree, deliberately minimal —
        no filters, no details, no cross-session view. Those live on the full
        board. Colour comes from the host's --oc-* variables via applyHostReady;
        the `--t-*` names are this page's own, with light-theme fallbacks so the
        first paint is readable before the theme lands.
      */
      :root {
        --t-fg: var(--oc-fg, #100f0f);
        --t-muted: var(--oc-muted, #6f6e69);
        --t-border: var(--oc-border, #dad8ce);
        --t-hover: var(--oc-hover, rgba(0, 0, 0, .035));
        --t-success: var(--oc-success, #66800b);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 12px/1.45 var(--oc-font, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif);
        background: transparent; color: var(--t-fg); overflow: hidden;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      #top { flex: 0 0 auto; padding: 10px 12px 2px; }
      #head { display: flex; align-items: center; gap: 8px; }
      #title { flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #jumpHost { flex: 0 0 auto; }
      #jumpHost[hidden] { display: none; }
      #meta {
        display: flex; align-items: center;
        gap: 12px; min-height: 26px; margin-top: 2px;
        color: var(--t-muted); font-size: 11px;
      }
      /* The count keeps the right edge; the toggle takes the left. */
      #count { margin-left: auto; font-variant-numeric: tabular-nums; }
      /* Soft pill instead of an outline: the header already has a rule (the
         progress bar) under it, and a second hairline read as clutter. The count
         gets its own badge so the number reads first; the chevron is an SVG so
         its stroke stays crisp. The surface mixes `currentColor` — the one
         colour the host guarantees in both themes. */
      #finished {
        display: inline-flex; align-items: center; gap: 6px;
        flex: 0 0 auto; height: 26px; margin: 0; padding: 0 13px 0 11px;
        border: 0; border-radius: 999px;
        background: color-mix(in srgb, currentColor 10%, transparent);
        color: var(--t-muted); font: inherit; font-size: 11px; line-height: 1;
        letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap;
        cursor: pointer; transition: background-color 140ms ease, color 140ms ease;
      }
      #finished[hidden] { display: none; }
      #finished:hover, #finished[aria-expanded="true"] {
        background: color-mix(in srgb, currentColor 16%, transparent);
        color: var(--t-fg);
      }
      #finished:focus-visible { outline: 2px solid var(--oc-primary, #205ea6); outline-offset: 2px; }
      #finished .lbl { display: inline-flex; align-items: center; }
      #finished .n {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 18px; height: 18px; margin: 0 5px; padding: 0 4px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--t-success) 18%, transparent);
        color: var(--t-success); font-size: 10px; line-height: 1; letter-spacing: 0;
      }
      #finished .cv {
        width: 10px; height: 10px; flex: 0 0 auto;
        transition: transform 160ms ease;
      }
      #finished[aria-expanded="true"] .cv { transform: rotate(90deg); }
      #bar { height: 2px; margin-top: 6px; border-radius: 999px; background: var(--t-border); overflow: hidden; }
      #bar > i {
        display: block; height: 100%; background: var(--oc-success, #66800b);
        width: 0; transition: width 240ms ease;
      }
      #legend { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 7px; font-size: 10px; color: var(--t-muted); }
      #legend:empty { display: none; }
      .lg { display: inline-flex; align-items: center; gap: 4px; }
      .lg > i { width: 7px; height: 7px; border-radius: 999px; }
      /*
        The list is wrapped so its bottom edge can carry a frost: a long tree
        dissolves into whatever sits below the panel instead of ending on a cut
        row. The frost is a sibling of the scroller (not a child), so it stays
        put while rows pass beneath it, and the list keeps enough bottom padding
        that the last row scrolls clear of it.
      */
      #body { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
      #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 12px 40px; }
      #frost {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: 28px; pointer-events: none;
        /* Only while rows remain below. `data-more` is set by syncEdge(). */
        opacity: 0; transition: opacity 160ms ease;
        /* The tint keeps blurred text from turning grey; it comes from the host
           palette, and stays clear when the host has not sent one yet. Past
           ~60% it swallows the only genuinely blurred rows and the edge reads
           as a plain fade. */
        background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--oc-bg, transparent) 55%, transparent));
        -webkit-backdrop-filter: blur(6px) saturate(1.1);
        backdrop-filter: blur(6px) saturate(1.1);
        /* A mask composites the blurred layer at partial alpha instead of
           weakening the blur: from `transparent` upward, most of the strip is
           sharp rows under a thin veil, which is why the edge first read as a
           fade with no blur at all. Starting at .45 and going opaque by 45%
           keeps a soft entry and leaves ~15px of full-strength blur. */
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .45), #000 45%);
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .45), #000 45%);
      }
      #root[data-more="true"] #frost { opacity: 1; }
      /* Without backdrop-filter the blur is gone, so lean on the tint alone —
         the edge still reads as a fade rather than a cut. */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        #frost { background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--oc-bg, transparent) 92%, transparent)); }
      }
      @media (prefers-reduced-motion: reduce) { #frost { transition: none; } }
      .row { display: flex; gap: 7px; align-items: flex-start; padding: 3px 0; border-radius: 5px; }
      .row .txt { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .row.completed .txt, .row.cancelled .txt { color: var(--t-muted); text-decoration: line-through; }
      .row.in_progress .txt { font-weight: 600; }
      .row.group .txt { font-weight: 600; }
      .row.cancelled { opacity: .65; }
      .empty { color: var(--t-muted); padding: 8px 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="top">
        <div id="head">
          <div id="title">Todos</div>
          <div id="jumpHost" hidden></div>
        </div>
        <div id="meta">
          <button id="finished" type="button" aria-expanded="false" aria-controls="list" hidden><svg class="cv" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.4 1.6 6.9 5l-3.5 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lbl">已完成 <span id="finishedN" class="n">0</span> 项</span></button>
          <span id="count">0/0</span>
        </div>
        <div id="bar"><i></i></div>
        <div id="legend"></div>
      </div>
      <div id="body">
        <div id="list"><div class="empty">Loading…</div></div>
        <div id="frost"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
