<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务图</title>
    <style>
      /*
        The task board: every session's task view, side by side, with a
        cross-session summary, filters, a view switch (tree / phase swimlanes),
        a session selector, and a node detail. Opened full-screen from Extension
        pages. Colour comes from the host's --oc-* variables via applyHostReady.
        The `.gut*` CSS is injected by src/gutter.js; the toolbar controls are
        mounted from @openchamber/sdk/ui so they match the app.
      */
      :root { --b-border: var(--oc-border, #dad8ce); --b-muted: var(--oc-muted, #6f6e69); --b-fg: var(--oc-fg, #100f0f); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 12px/1.45 var(--oc-font, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif);
        background: var(--oc-bg, transparent); color: var(--b-fg); overflow: hidden;
      }
      #root { height: 100%; display: flex; flex-direction: column; }
      #toolbar {
        flex: 0 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        padding: 10px 14px; border-bottom: 1px solid var(--b-border);
      }
      #searchHost { flex: 1 1 180px; min-width: 150px; max-width: 300px; }
      #sessionHost { min-width: 180px; }
      #viewHost { min-width: 120px; }
      #statusHost, #phaseHost { min-width: 130px; }
      #finishedHost { flex: 0 0 auto; }
      #archiveHost { flex: 0 0 auto; position: relative; }
      /* the archive control: one button whose label is the candidate count, and a
         popover holding the sweep switch, its age threshold and the bulk runs */
      .arch-pop {
        position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
        width: 320px; max-width: calc(100vw - 28px); padding: 10px;
        border: 1px solid var(--b-border); border-radius: 10px;
        background: var(--oc-elevated, var(--oc-bg, #fff)); color: var(--oc-elevated-fg, var(--b-fg));
        box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
        display: flex; flex-direction: column; gap: 6px; font-size: 11px;
      }
      .arch-pop .ap-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
      .arch-pop .ap-head b { font-size: 12px; }
      .arch-pop .ap-head > span { margin-left: auto; color: var(--b-muted); }
      .arch-pop .ap-row { display: flex; align-items: center; gap: 6px; min-height: 22px; }
      .arch-pop .ap-l { flex: 1 1 auto; min-width: 0; }
      .arch-pop .ap-n { font-variant-numeric: tabular-nums; }
      .arch-pop .ap-tag {
        flex: 0 0 auto; font-size: 10px; color: var(--b-muted);
        border: 1px solid var(--b-border); border-radius: 999px; padding: 0 6px;
      }
      .arch-pop .ap-tag.manual { color: var(--oc-warning-text, var(--oc-warning, #b7791f)); border-color: currentColor; }
      .arch-pop .ap-check { cursor: pointer; }
      .arch-pop .ap-check.muted { opacity: .5; }
      .arch-pop .ap-check input { margin: 0; flex: 0 0 auto; }
      .arch-pop .ap-hint { color: var(--b-muted); font-size: 10px; line-height: 1.45; padding-left: 20px; }
      .arch-pop .ap-hr { height: 1px; background: var(--b-border); margin: 2px 0; }
      .arch-pop .ap-days { color: var(--b-muted); }
      .arch-pop .ap-days input {
        width: 52px; font: inherit; text-align: center; padding: 2px 4px;
        border: 1px solid var(--b-border); border-radius: 5px;
        background: var(--oc-bg, transparent); color: var(--b-fg);
      }
      .arch-pop .ap-actions { display: flex; gap: 6px; justify-content: flex-end; }
      .arch-pop .ap-btn {
        font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer;
        border: 1px solid var(--b-border); border-radius: 6px;
        background: none; color: var(--b-fg);
      }
      .arch-pop .ap-btn.pri { background: var(--oc-primary, #205ea6); border-color: transparent; color: var(--oc-primary-fg, #fff); }
      .arch-pop .ap-btn:disabled { opacity: .45; cursor: default; }

      #summary {
        flex: 0 0 auto; padding: 10px 14px; border-bottom: 1px solid var(--b-border);
        display: flex; flex-direction: column; gap: 8px;
      }
      #summary .stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--b-muted); align-items: baseline; }
      #summary .stats b { color: var(--b-fg); }
      #summary .blocked { color: var(--oc-error, #af3029); }
      #summary .phases { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--b-muted); }
      #summary .ph-tools { display: inline-flex; border: 1px solid var(--b-border); border-radius: 6px; overflow: hidden; }
      #summary .ph-seg {
        font: inherit; font-size: 10px; padding: 1px 7px; border: 0; background: none;
        color: var(--b-muted); cursor: pointer;
      }
      #summary .ph-seg.on { background: var(--oc-hover, rgba(0, 0, 0, .07)); color: var(--b-fg); }
      #summary .ph-toggle {
        font: inherit; font-size: 10px; padding: 1px 7px; cursor: pointer;
        border: 1px solid var(--b-border); border-radius: 6px; background: none; color: var(--b-muted);
      }
      #summary .ph-toggle.on { color: var(--b-fg); border-color: var(--b-fg); }
      #summary .ph-row { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
      #summary .ph-chip, #summary .ph-fam, #summary .ph-more, #summary .ph-back {
        display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 11px;
        padding: 1px 7px; border: 1px solid transparent; border-radius: 999px;
        background: var(--oc-subtle, rgba(0, 0, 0, .03)); color: var(--b-fg); cursor: pointer;
      }
      #summary .ph-chip:hover, #summary .ph-fam:hover { border-color: var(--b-border); }
      #summary .ph-chip.on {
        border-color: var(--oc-primary, #205ea6);
        background: color-mix(in srgb, var(--oc-primary, #205ea6) 12%, transparent);
      }
      #summary .ph-chip.static { cursor: default; }
      #summary .ph-chip > i { width: 6px; height: 6px; border-radius: 999px; flex: 0 0 auto; }
      #summary .ph-chip > b, #summary .ph-fam > b {
        color: var(--b-muted); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 10px;
      }
      #summary .ph-fam { border-color: var(--b-border); background: none; }
      #summary .ph-fam > i { width: 3px; align-self: stretch; min-height: 12px; border-radius: 2px; flex: 0 0 auto; }
      #summary .ph-fam.on { border-color: var(--b-fg); }
      #summary .ph-caret { color: var(--b-muted); font-size: 9px; }
      #summary .ph-more { color: var(--oc-primary, #205ea6); border: 1px dashed var(--b-border); background: none; }
      #summary .ph-back { color: var(--b-muted); border: 1px solid var(--b-border); background: none; }
      #summary .ph-none { color: var(--b-muted); }
      #summary .ph-toggle.ai { color: var(--oc-primary, #205ea6); border-color: color-mix(in srgb, var(--oc-primary, #205ea6) 45%, transparent); }
      #summary .ph-toggle:disabled { opacity: .6; cursor: default; }
      #summary .ph-manage {
        display: flex; flex-direction: column; gap: 6px; padding: 8px 10px;
        border: 1px solid var(--b-border); border-radius: 8px;
        background: var(--oc-subtle, rgba(0, 0, 0, .03));
      }
      #summary .ph-manage-head { display: flex; align-items: center; gap: 8px; }
      #summary .ph-manage-head b { font-size: 11px; }
      #summary .ph-manage-head .ph-toggle:first-of-type { margin-left: auto; }
      #summary .ph-manage-list {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 2px 12px;
        max-height: 180px; overflow-y: auto;
      }
      #summary .ph-manage-row { display: flex; align-items: center; gap: 6px; font-size: 11px; cursor: pointer; }
      #summary .ph-manage-row input { margin: 0; flex: 0 0 auto; }
      #summary .ph-manage-row > span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #summary .ph-manage-row > b { color: var(--b-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
      #summary .ph-manage-row > i { font-style: normal; color: var(--b-muted); font-size: 10px; width: 3.6em; text-align: right; }
      #summary .ph-hint { color: var(--b-muted); font-size: 10px; line-height: 1.45; }
      #summary .ph-ai {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding-top: 6px; border-top: 1px dashed var(--b-border);
      }
      #summary .ph-ai-l { font-size: 11px; color: var(--b-muted); }
      #summary .ph-ai-msg { font-size: 11px; overflow-wrap: anywhere; }
      #summary .ph-ai-msg.ok { color: var(--oc-success-text, var(--oc-success, #66800b)); }
      #summary .ph-ai-msg.fail { color: var(--oc-error-text, var(--oc-error, #af3029)); }
      #summary .ph-ai-hint { font-size: 10px; color: var(--b-muted); }

      #main { flex: 1 1 auto; min-height: 0; display: flex; }
      #sessions { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 12px 16px; }
      #details { flex: 0 0 280px; border-left: 1px solid var(--b-border); padding: 14px; overflow-y: auto; }

      .sess { margin-bottom: 22px; max-width: 900px; }
      .sess-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .sess-head h3 { margin: 0; font-size: 12px; font-weight: 600; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sess-head .cnt { color: var(--b-muted); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
      .prog { height: 2px; border-radius: 999px; background: var(--b-border); overflow: hidden; margin-bottom: 6px; }
      .prog > i { display: block; height: 100%; background: var(--oc-success, #66800b); }

      .row { display: flex; gap: 7px; align-items: flex-start; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
      .row:hover { background: var(--oc-hover, rgba(0, 0, 0, .04)); }
      .row.sel { background: var(--oc-selection, var(--oc-hover, rgba(0, 0, 0, .06))); }
      .row .txt { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .row.completed .txt, .row.cancelled .txt { color: var(--b-muted); text-decoration: line-through; }
      .row.in_progress .txt { font-weight: 600; }
      .row.group .txt { font-weight: 600; }
      .row.group { cursor: default; }
      .row.dim { opacity: .3; }
      .pill { flex: 0 0 auto; font-size: 10px; color: var(--b-muted); border: 1px solid var(--b-border); border-radius: 999px; padding: 0 6px; }
      .pill.blocked { color: var(--oc-error, #af3029); border-color: var(--oc-error, #af3029); border-style: dashed; }

      .swim { overflow: auto; max-height: 62vh; border: 1px solid var(--b-border); border-radius: 8px; background: var(--oc-subtle, transparent); }
      .swim svg { display: block; }

      #details h3 { margin: 0 0 10px; font-size: 12px; }
      #details .content { font-weight: 600; margin: 6px 0 10px; overflow-wrap: anywhere; }
      #details .kv { color: var(--b-muted); font-size: 11px; margin: 3px 0; }
      #details .kv a { color: var(--oc-primary, #205ea6); cursor: pointer; text-decoration: underline; }
      #details .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
      .note { color: var(--b-muted); padding: 12px; }

      /* per-card archive / restore, in the card header */
      .sess-act {
        flex: 0 0 auto; font: inherit; font-size: 10px; line-height: 1.4;
        color: var(--b-muted); background: none; border: 1px solid var(--b-border);
        border-radius: 999px; padding: 1px 8px; cursor: pointer;
      }
      .sess-act:hover { color: var(--b-fg); border-color: var(--b-fg); }
      .sess.archived { opacity: .72; }

      /* the set-aside sessions, collapsed by default */
      .archive { max-width: 900px; margin: 10px 0 0; }
      .arch-fold {
        display: flex; align-items: center; gap: 8px; width: 100%; max-width: 900px;
        padding: 10px 12px; border: 1px dashed var(--b-border); border-radius: 10px;
        background: none; color: var(--b-muted); font: inherit; cursor: pointer; text-align: left;
      }
      .arch-fold .n { margin-left: auto; }
      .arch-fold[aria-expanded="true"] { margin-bottom: 14px; }

      /* a short-lived undo for the last archive action */
      .undo-bar {
        display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 0 12px;
        padding: 8px 12px; border-radius: 8px; background: var(--oc-subtle, rgba(0, 0, 0, .04));
        color: var(--b-muted); font-size: 11px;
      }
      .undo-bar #undoBtn, .undo-bar #undoDismiss {
        border: 0; background: none; font: inherit; cursor: pointer; padding: 0;
      }
      .undo-bar #undoBtn { color: var(--oc-primary, #205ea6); text-decoration: underline; }
      .undo-bar #undoDismiss { color: var(--b-muted); margin-left: auto; }

      /* the pinned current-session card, set apart from the recency list below */
      .sess.pinned {
        border: 1px solid var(--oc-primary, #205ea6);
        border-color: color-mix(in srgb, var(--oc-primary, #205ea6) 34%, var(--b-border));
        background: color-mix(in srgb, var(--oc-primary, #205ea6) 5%, transparent);
        border-radius: 10px; padding: 10px 12px 12px;
      }
      .pin-tag {
        display: inline-block; font-size: 10px; color: var(--oc-primary-foreground, #fff);
        background: var(--oc-primary, #205ea6); border-radius: 999px; padding: 1px 8px; margin-bottom: 6px;
      }
      .divider { display: flex; align-items: baseline; gap: 8px; max-width: 900px; margin: 4px 0 14px; color: var(--b-muted); font-size: 11px; }
      .divider::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--b-border); }
      .sentinel {
        max-width: 900px; margin: 2px 0 0; padding: 12px; border: 1px dashed var(--b-border);
        border-radius: 10px; color: var(--b-muted); text-align: center; cursor: pointer;
      }
      .endnote { max-width: 900px; color: var(--b-muted); font-size: 11px; text-align: center; margin-top: 8px; }
      .link { border: 0; background: none; color: var(--oc-primary, #205ea6); font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="toolbar">
        <div id="searchHost"></div>
        <div id="sessionHost"></div>
        <div id="viewHost"></div>
        <div id="statusHost"></div>
        <div id="phaseHost"></div>
        <div id="finishedHost"></div>
        <div id="archiveHost"></div>
      </div>
      <div id="summary"></div>
      <div id="main">
        <div id="sessions"><div class="note">Loading…</div></div>
        <div id="details"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
